<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | R-Abhi Tech Solution</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="topbar-brand">
        <img src="logo2.png" alt="R-Abhi Tech Solution" class="site-logo" />
        <div>
          <p class="brand-name">R-ABHI TECH SOLUTION</p>
          <p class="brand-tagline">Get in touch with our team.</p>
        </div>
      </div>
      <div class="header-main-actions">
        <a href="index.html" class="secondary-btn">Home</a>
        <a href="analytics.html" class="btn">Analytics</a>
      </div>
    </header>

    <section class="section panel">
      <h1>Contact us</h1>
      <p style="color:#cbd5e1; line-height:1.8;">Reach out for sponsorship partnerships, campaign support, or portal onboarding.</p>
      <form class="grid" style="margin-top:16px;">
        <label>Name<input required /></label>
        <label>Email<input type="email" required /></label>
        <label>Message<textarea rows="4" required></textarea></label>
        <button type="submit">Send message</button>
      </form>
    </section>
  </div>
