<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration | R-Abhi Tech Solution</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="topbar-brand">
        <img src="logo2.png" alt="R-Abhi Tech Solution" class="site-logo" />
        <div>
          <p class="brand-name">R-ABHI TECH SOLUTION</p>
          <p class="brand-tagline">Create your sponsor or client account.</p>
        </div>
      </div>
      <div class="header-main-actions">
        <a href="index.html" class="secondary-btn">Home</a>
        <a href="login.html" class="btn">Login</a>
      </div>
    </header>

    <section class="section two-col">
      <div class="panel">
        <h2>Sponsor registration</h2>
        <form class="grid" style="margin-top:16px;">
          <label>Name<input required /></label>
          <label>Email<input type="email" required /></label>
          <label>Password<input type="password" required /></label>
          <button type="submit">Register as sponsor</button>
        </form>
      </div>
      <div class="panel">
        <h2>Client registration</h2>
        <form class="grid" style="margin-top:16px;">
          <label>Name<input required /></label>
          <label>Email<input type="email" required /></label>
          <label>Company<input /></label>
          <label>Password<input type="password" required /></label>
          <button type="submit">Register as client</button>
        </form>
      </div>
    </section>
  </div>
</body>
</html>
